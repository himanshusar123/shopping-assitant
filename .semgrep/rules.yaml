rules:
  - id: detect-hardcoded-google-api-key
    pattern-regex: 'AIzaSy[A-Za-z0-9_\-]*'
    message: "Security Warning: A hardcoded Google API key or prefix has been detected. Hardcoding sensitive credentials poses a major security risk. Use environment variables or a secure secret manager instead."
    languages:
      - python
    severity: ERROR
